[package]
name = "ride-tauri"
version = "1.72.100"
authors = ["R-IDE contributors"]
license = "MIT"
repository = "https://github.com/eclipse-theia/theia-ide"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "server", "tokio"] }
tauri = { version = "2.1", features = ["macos-private-api", "tray-icon", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
dunce = "1.0"
uuid = { version = "1.0", features = ["v4"] }
signal-hook = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
portable-pty = "0.9"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
window-vibrancy = "0.6.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio-tungstenite = "0.28"
